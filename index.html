<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>PUICE 2026 - Petaling Utama Innovative Conference on Education</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Animasi Cop Hentakan Sinematik */
    @keyframes stampSlam {
      0% { opacity: 0; transform: scale(5) rotate(-12deg); }
      70% { opacity: 1; transform: scale(0.9) rotate(-3deg); }
      85% { transform: scale(1.05) rotate(-5deg); }
      100% { transform: scale(1) rotate(-4deg); }
    }

    /* Animasi Kilat Flashing Red */
    @keyframes emergencyFlash {
      0%, 100% { background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); }
      50% { background-color: rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.8); }
    }

    .animate-stamp { animation: stampSlam 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-emergency { animation: emergencyFlash 0.3s infinite; }
    
    .autocomplete-items { position: absolute; border: 1px solid #e2e8f0; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; border-radius: 0 0 12px 12px; max-height: 200px; overflow-y: auto; }
    .autocomplete-items div { padding: 10px; cursor: pointer; background-color: #fff; border-bottom: 1px solid #e2e8f0; }
    .autocomplete-items div:hover { background-color: #f1f5f9; }
    .fade-slide { transition: all 0.5s ease-in-out; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased overflow-x-hidden">

  <!-- CINEMATIC OVERLAY CONTAINER -->
  <div id="cinematicWrapper" class="min-h-screen bg-slate-50 transition-all duration-700">
    
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-100">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">PUICE <span class="text-blue-600">2026</span></h1>
          <p class="text-xs text-slate-500 font-medium hidden sm:block">Petaling Utama Innovative Conference on Education</p>
        </div>
        <nav><span id="badgeStatusHeader" class="text-sm font-semibold text-amber-700 bg-amber-100 px-3 py-1.5 rounded-full transition-all">Memproses Status...</span></nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 sm:py-12 relative">
      
      <!-- SEKSYEN UTAMA -->
      <div id="seksyenUtama" class="fade-slide">
        
        <!-- Image Slider Slideshow -->
        <div class="relative overflow-hidden rounded-2xl bg-slate-100 shadow-xl border border-slate-100 aspect-[4/3] sm:aspect-[16/9]">
          <img class="mySlides w-full h-full object-contain hidden" src="https://cdn.phototourl.com/free/2026-07-16-4f01c664-ef3e-4f11-8a6a-8b56b07a4f35.jpg" alt="Hebahan 1">
          <img class="mySlides w-full h-full object-contain hidden" src="https://cdn.phototourl.com/free/2026-07-16-efec3f87-6eb9-47ec-9088-c6f17bdf3329.jpg" alt="Hebahan 2">
          
          <button onclick="plusSlides(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 text-white p-2 rounded-full hover:bg-black/70 cursor-pointer">❮</button>
          <button onclick="plusSlides(1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 text-white p-2 rounded-full hover:bg-black/70 cursor-pointer">❯</button>
        </div>

        <div class="mt-8 text-center max-w-2xl mx-auto relative">
          
          <!-- BANNER COUNTDOWN DRAMATIK & COP KUNCI -->
          <div id="bannerLanjutan" class="relative overflow-hidden mb-6 p-6 rounded-2xl bg-amber-50 border-2 border-amber-300 text-amber-950 shadow-lg transition-all duration-500">
            
            <!-- STAMP LOCKDOWN DENGAN TEKS BARU -->
            <div id="stampClosed" class="hidden absolute inset-0 z-20 flex items-center justify-center bg-slate-950/50 backdrop-blur-xs p-4">
              <span class="animate-stamp inline-block border-4 sm:border-8 border-red-600 text-red-500 font-black text-lg sm:text-2xl uppercase px-5 py-2.5 rounded-2xl tracking-wider shadow-2xl bg-slate-950/95 -rotate-3 text-center leading-tight">
                🔒 TEMPOH PENDAFTARAN PERTANDINGAN TAMAT
              </span>
            </div>

            <p id="teksNotis" class="text-base sm:text-lg font-bold leading-relaxed tracking-wide">
              ⚡ AMARAN SISTEM: MASA PENDAFTARAN HAMPIR TAMAT!
            </p>
            
            <div id="boxCountdown" class="mt-4 flex justify-center items-center space-x-2 font-mono font-black text-lg sm:text-2xl text-red-600"></div>
          </div>

          <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Persidangan Inovasi Pendidikan PUICE 2026</h2>
          <p class="mt-4 text-base sm:text-lg text-slate-600 leading-relaxed">Platform persidangan inovasi berprestij anjuran PPD Petaling Utama.</p>
          
          <!-- BUTANG UTAMA -->
          <div class="mt-8">
            <button id="btnSertai" class="inline-flex items-center justify-center px-8 py-4 text-base font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all rounded-xl shadow-lg cursor-pointer transform hover:scale-105">
              <span>Sertai Sekarang</span>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // --- SKRIP EFFECT DRAMATIK LOCKDOWN ---
    function muatSinematikLockdown() {
      const banner = document.getElementById('bannerLanjutan');
      const teksNotis = document.getElementById('teksNotis');
      const boxCountdown = document.getElementById('boxCountdown');
      const stampClosed = document.getElementById('stampClosed');
      const btnSertai = document.getElementById('btnSertai');
      const badgeHeader = document.getElementById('badgeStatusHeader');
      const cinematicWrapper = document.getElementById('cinematicWrapper');

      let detikMasa = 30;

      banner.classList.add('animate-emergency');

      const pemasaLaju = setInterval(() => {
        detikMasa--;

        let jamSim = Math.floor(detikMasa / 10);
        let minitSim = (detikMasa * 8) % 60;
        let saatSim = (detikMasa * 19) % 60;

        boxCountdown.innerHTML = `
          <div class="bg-slate-900 text-red-500 px-3 py-1.5 rounded-lg border border-red-500/30 shadow-inner">${String(jamSim).padStart(2, '0')}</div> :
          <div class="bg-slate-900 text-red-500 px-3 py-1.5 rounded-lg border border-red-500/30 shadow-inner">${String(minitSim).padStart(2, '0')}</div> :
          <div class="bg-slate-900 text-red-500 px-3 py-1.5 rounded-lg border border-red-500/30 shadow-inner">${String(saatSim).padStart(2, '0')}</div>
        `;

        // MOMEN LOCKDOWN SEBAIK DETIK MASA TAMAT
        if (detikMasa <= 0) {
          clearInterval(pemasaLaju);

          banner.classList.remove('animate-emergency');
          cinematicWrapper.classList.add('backdrop-blur-md');
          stampClosed.classList.remove('hidden');

          banner.className = "relative overflow-hidden mb-6 p-6 rounded-2xl bg-red-950 border-2 border-red-600 text-red-100 shadow-2xl transition-all duration-500";
          teksNotis.innerHTML = `<span class="text-sm font-semibold opacity-80">SISTEM DIKUNCI: BORANG PENDAFTARAN TELAH DITUTUP SEPENUHNYA</span>`;
          boxCountdown.innerHTML = `<span class="text-xs text-red-400 font-mono tracking-widest mt-2">[ SYSTEM OFF-LINE ]</span>`;

          badgeHeader.className = "text-sm font-bold text-red-400 bg-red-950/80 border border-red-800 px-3 py-1.5 rounded-full shadow-sm";
          badgeHeader.innerText = "⛔ Pendaftaran Ditutup";

          btnSertai.disabled = true;
          btnSertai.className = "inline-flex items-center justify-center px-8 py-4 text-base font-bold text-slate-500 bg-slate-300 border border-slate-400 rounded-xl cursor-not-allowed shadow-none transform opacity-60";
          btnSertai.innerHTML = `<span>🔒 Pendaftaran Telah Ditutup</span>`;
        }
      }, 60);
    }

    window.addEventListener('DOMContentLoaded', muatSinematikLockdown);

    // --- LOGIK SLIDESHOW ---
    let slideIndex = 1;
    showSlides(slideIndex);
    function plusSlides(n) { showSlides(slideIndex += n); }
    function showSlides(n) {
      let i;
      let slides = document.getElementsByClassName("mySlides");
      if (n > slides.length) {slideIndex = 1}    
      if (n < 1) {slideIndex = slides.length}
      for (i = 0; i < slides.length; i++) { slides[i].classList.add("hidden"); }
      if(slides[slideIndex-1]) slides[slideIndex-1].classList.remove("hidden");
    }
    setInterval(() => { plusSlides(1); }, 5000);
  </script>
</body>
</html>
